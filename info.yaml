# Tiny Tapeout project information

project:
  title: "Pantografo"
  author: "Jean Cárdenas"
  discord: ""
  description: "Deteccion de bloqueos mecanicos y fallas de recorrido en un pantografo de corte X-Y."
  language: "Verilog"
  clock_hz: 10000000

  tiles: "1x1"

  top_module: "tt_um_example"

  source_files:
    - "project.v"

# Pinout
pinout:
  # Inputs
  ui[0]: "MOV_X"
  ui[1]: "MOV_Y"
  ui[2]: "ENC_X"
  ui[3]: "ENC_Y"
  ui[4]: "LIM_X_POS"
  ui[5]: "LIM_X_NEG"
  ui[6]: "LIM_Y_POS"
  ui[7]: "LIM_Y_NEG"

  # Outputs
  uo[0]: "BLOCK_X"
  uo[1]: "BLOCK_Y"
  uo[2]: "FAULT_X_POS"
  uo[3]: "FAULT_X_NEG"
  uo[4]: "FAULT_Y_POS"
  uo[5]: "FAULT_Y_NEG"
  uo[6]: "ALARM"
  uo[7]: "STOP"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
